server {
    listen 80;
    server_name _;

    # El ALB enruta /docs* a este servicio sin recortar el prefijo,
    # por lo que el contenido se sirve bajo /docs/.
    location = /docs {
        return 301 /docs/;
    }

    location /docs/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /docs/index.html;
    }
}
