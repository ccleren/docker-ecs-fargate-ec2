server {
    listen 80;
    server_name _;

    # El ALB enruta /status* a este servicio sin recortar el prefijo,
    # por lo que el contenido se sirve bajo /status/.
    location = /status {
        return 301 /status/;
    }

    location /status/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /status/index.html;
    }
}
